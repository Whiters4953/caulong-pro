<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d3a40">
<title>Trực tiếp thi đấu – CầuLông Pro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;font-family:'Be Vietnam Pro',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
  body{margin:0;background:radial-gradient(1200px 600px at 50% -10%,rgba(20,184,166,.28),transparent 60%),#061018;color:#f8fafc;min-height:100vh;-webkit-font-smoothing:antialiased}
  header{position:sticky;top:0;z-index:10;padding:16px 24px;background:rgba(13,31,45,.9);backdrop-filter:blur(16px);border-bottom:1px solid #1e3348;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;color:#fff;text-decoration:none}
  .logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,#14b8a6,#0f766e);display:grid;place-items:center;font-size:19px;box-shadow:0 4px 14px -4px rgba(20,184,166,.7)}
  .badge{background:linear-gradient(135deg,#ef4444,#dc2626);color:#fff;border-radius:999px;padding:5px 14px;font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:6px;letter-spacing:.05em;box-shadow:0 4px 12px rgba(239,68,68,.4)}
  .dot{width:8px;height:8px;border-radius:50%;background:#fff;animation:pulse 1.4s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  .wrap{max-width:1080px;margin:28px auto;padding:0 16px;display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:18px}
  .m{background:linear-gradient(180deg,#0f2435 0%,#091620 100%);border:1px solid #1e3a52;border-radius:20px;padding:22px;box-shadow:0 14px 36px -12px rgba(0,0,0,.65)}
  .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;font-size:13px;color:#94a3b8}
  .court{background:#0d4a45;color:#5eead4;padding:4px 12px;border-radius:999px;font-weight:700;font-size:12px;border:1px solid rgba(94,234,212,.25)}
  .row{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:12px 16px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);margin-bottom:10px}
  .row.win{background:rgba(34,197,94,.14);border-color:rgba(34,197,94,.4)}
  .team{font-size:19px;font-weight:700;flex:1;line-height:1.3}
  .row.win .team{color:#4ade80}
  .pts{font-family:'JetBrains Mono',monospace;font-size:48px;font-variant-numeric:tabular-nums;font-weight:800;line-height:1;color:#fbbf24}
  .sub{color:#94a3b8;font-size:13px;margin-top:12px;display:flex;justify-content:space-between;align-items:center}
  .sets span{font-family:'JetBrains Mono',monospace;display:inline-block;background:#1e3348;color:#e2e8f0;padding:3px 9px;border-radius:7px;margin-left:5px;font-weight:700;font-size:12px}
  .empty{grid-column:1/-1;text-align:center;padding:56px 20px;color:#94a3b8}
</style>
</head>
<body>
<header>
  <a href="/" class="brand"><span class="logo">🏸</span><span>CầuLông Pro · Bảng điểm trực tiếp BWF</span></a>
  <span class="badge"><span class="dot"></span>LIVE 21 ĐIỂM</span>
</header>
<div class="wrap" id="list">
  <div class="m empty">Đang chờ trận đấu bắt đầu…</div>
</div>
<script src="/socket.io/socket.io.js"></script>
<script src="/standalone.js"></script>
<script>
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function load(){
  const ls=await (await fetch('/api/live')).json();
  if(!ls.length){list.innerHTML='<div class="m empty">Chưa có trận nào đang diễn ra.</div>';return;}
  list.innerHTML=ls.map(l=>{
    const g=l.state.games,cur=g[g.length-1]||{a:0,b:0};
    return `<div class="m">
      <div class="head"><span class="court">🏸 Sân ${l.court}</span><span>${g.length?'Hiệp '+g.length+' / Thể thức BWF 21 điểm':'Sắp bắt đầu'}${l.state.winner?' · ĐÃ KẾT THÚC':''}</span></div>
      <div class="row ${l.state.winner==='A'?'win':''}"><div class="team">${esc(l.a)} ${l.state.winner==='A'?'🏆':''}</div><div class="pts">${cur.a}</div></div>
      <div class="row ${l.state.winner==='B'?'win':''}"><div class="team">${esc(l.b)} ${l.state.winner==='B'?'🏆':''}</div><div class="pts">${cur.b}</div></div>
      <div class="sub"><span>Tỉ số các ván</span><div class="sets">${g.map(x=>`<span>${x.a}–${x.b}</span>`).join('')||'<span>0–0</span>'}</div></div>
    </div>`;
  }).join('');
}
load(); io().on('live',load);
</script>
</body>
</html>
